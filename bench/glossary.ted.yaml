# TED2020 벤치마크 용어집 (설계 스펙 §5.6)
#
# 자동 후보 추출 + 수동 확정. 전자동 통계 정렬을 쓰지 않는 이유는 오대응이
# 섞이면 "용어집이 틀려서 생긴 오탐"과 "검출기 성능"을 구분할 수 없기 때문이다.
#
# **채택 기준에 대응률을 넣었다.** 판정 규칙이 "원문에 키가 있는데 번역문에
# 대응어가 하나도 없으면 위반"이므로, 대응률이 낮은 용어는 깨끗한 트랙에서
# 정상 번역을 대량으로 위반 판정한다. 실측 예: `의사`는 en 대응률 56.1%라
# 정상 번역의 44%를 오탐한다(영어가 physician·surgeon으로 쓰거나 재구성한다).
# 아래 30개는 en·ja 양쪽에서 등장 20회 이상 · 대응률 79.8% 이상인 것만 남긴 것이다.
# 괄호 안 숫자는 TED2020 전체에서 실측한 (en 대응률 / ja 대응률)이다.
#
# 대응어가 여러 개면 하나만 나와도 통과다(cuesift.glossary의 판정 규칙).
# 그래서 흔한 표기 변형을 함께 적어야 정상 번역이 오탐으로 잡히지 않는다 —
# 대응어 목록을 넓히는 것이 곧 대응률을 올리는 수단이었다.
