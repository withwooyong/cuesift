[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuesift"
version = "0.0.1.dev0"
description = "AI 자막 번역·검수 트리아지 엔진 — 사람이 정말 봐야 할 자막만 걸러냅니다"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ted", email = "withwooyong@gmail.com" }]
keywords = ["subtitle", "translation", "quality-estimation", "srt", "webvtt", "localization"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]

# v0.1 최소 의존성. STT(WhisperX)·품질추정(COMET)은 무거우므로
# 아래 optional-dependencies로 분리한다 — `pip install cuesift`가
# torch를 끌고 오지 않도록 하기 위함이다.
dependencies = [
    "typer>=0.12",
    "pysubs2>=1.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["whisperx>=3.1"]
qe = ["unbabel-comet>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
# `cli:app`이 아니라 `cli:run`이다. `app`을 직접 두면 `cuesift --help | less`처럼
# 하류가 먼저 닫는 흔한 사용에서 종료 코드가 120으로 덮인다 — `run`이 그것을 막는다.
cuesift = "cuesift.cli:run"

[project.urls]
Homepage = "https://github.com/withwooyong/cuesift"
Repository = "https://github.com/withwooyong/cuesift"
Issues = "https://github.com/withwooyong/cuesift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cuesift"]

[tool.hatch.build.targets.wheel.force-include]
"specs" = "cuesift/specs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers`가 켜져 있어 아래 `markers`에 없는 마커는 경고가 아니라
# **수집 에러**다. 실측(2026-08-16): 미등록 `@pytest.mark.live` 하나가
# `Interrupted: 1 error during collection`으로 exit 2를 내고 **나머지 848개가
# 아예 실행되지 않는다.** 한 파일이 빨개지는 정도가 아니라 스위트 전체가 선다.
#
# `-m "not live"`가 없으면 CI 3잡이 전부 API 키 없이 실패한다. 명령줄에서
# `-m live`를 주면 이 기본값을 덮는다(뒤에 온 `-m`이 이긴다).
#
# 이 줄을 넣은 뒤로 `pytest -q`의 마지막 줄은 `N passed, M deselected` 형태다.
# **수집 개수를 읽는 법이 바뀌었다** - `passed`만 보면 live가 통째로 사라진
# 것을 눈치채지 못하므로 두 수를 같이 읽는다.
addopts = '-ra --strict-markers -m "not live"'
markers = [
    "live: 실제 LLM 엔드포인트를 친다. 기본 제외이며 CUESIFT_LIVE_BASE_URL과 CUESIFT_LIVE_MODEL이 필요하다",
]
# 이 설정이 어긋나면 `tests/conftest.py`의 `pytest_configure`가 수집 전에
# 실행을 멈춘다. 테스트로 두지 않은 이유는 `-m live`를 덧붙이는 변이가
# **감시자 자신까지 deselect**해 exit 0으로 초록을 내기 때문이다 (실측).
# bench/ 와 scripts/ 는 휠에 들어가지 않으므로 설치 경로로 임포트되지 않는다.
# 리포 루트를 sys.path에 넣지 않으면 tests/test_bench_*.py가 전부 수집 오류가 된다.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "bench", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# 마크다운 안의 파이썬 코드 블록은 포매팅하지 않는다.
#
# ruff 0.16이 `.md`의 코드 블록을 포매팅 대상에 넣으면서 CI의
# `ruff format --check .`가 깨졌다. 이 저장소의 문서 코드 블록은 프로덕션
# 코드가 아니다 — 계획서의 블록은 **구현자에게 준 그대로**가 기록이고,
# "초판은 이랬다"로 남긴 폐기 형태와 스펙의 안티패턴 예시도 있다.
# 재포맷하면 기록이 사실과 달라진다.
#
# 린트(`ruff check .`)는 마크다운을 건드리지 않으므로 그대로 둔다.
# 이 줄을 지우면 `docs/superpowers/{plans,specs}/*.md` 4개 이상에서
# `ruff format --check .`가 즉시 실패한다.
exclude = ["*.md"]
