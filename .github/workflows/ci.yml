name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # **`pyproject.toml`의 `requires-python`과 같은 집합이어야 한다.**
        # `>=3.11`이라 적어 놓고 3.11·3.12만 돌리면 3.13·3.14는 지원한다고
        # 선언된 채 아무도 검사하지 않는다 - 검사하지 않는 것을 검사한다고
        # 적으면 그 게이트는 없는 것보다 나쁘다. 개발자 로컬이 3.14라
        # 그 하나만 우연히 돌고 있었고, 그것은 게이트가 아니다.
        #
        # 옛 판은 'torch 계열 휠이 안정적인 버전만'이라 적어 좁혔는데,
        # **torch는 지금 의존성이 아니다**(런타임 4종: typer·pysubs2·
        # pyyaml·httpx). WP9(STT)가 붙는 시점에 3.14 휠이 없으면 그때
        # 이 목록과 `requires-python`을 **함께** 좁힌다 - 한쪽만 좁히면
        # 선언과 검증이 다시 갈라진다.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 린트 (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: 테스트 (pytest)
        run: pytest --cov=cuesift --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # markdownlint는 문법 린터라 링크가 실제로 존재하는지는 보지 않는다.
      # `[문서](없는파일.md)`도 문법적으로는 올바른 마크다운이라 통과한다.
      # 실제로 문서를 docs/로 옮겼을 때 README 링크 4개가 끊겼는데도
      # markdownlint는 0 issues였다.
      #
      # 표준 라이브러리만 쓰므로 의존성 설치가 필요 없다.
      - name: 링크 검사 (내부 상대 링크)
        run: python scripts/check_links.py

      # 버전을 고정한다. npx가 매번 최신을 받아오면 새 규칙이 추가된 날
      # 코드 변경 없이 CI가 깨진다.
      #
      # 검사 대상(globs)과 규칙은 .markdownlint-cli2.jsonc에 있다.
      # 인자 없이 실행하되, 설정에 globs가 빠지면 0개 파일을 검사하고도
      # 통과하므로 아래 스텝에서 검사한 파일 수를 함께 확인한다.
      - name: 문서 린트 (markdownlint)
        # 기본 셸은 `bash -e`라 파이프라인 종료 코드가 마지막 명령(tee)의
        # 것이 된다. pipefail이 없으면 lint 실패가 통과로 둔갑한다.
        shell: bash
        run: |
          set -eo pipefail
          npx --yes markdownlint-cli2@0.23.2 2>&1 | tee lint.log
          if grep -qE '^Linting: 0 files' lint.log; then
            echo "::error::검사한 파일이 0개다. .markdownlint-cli2.jsonc의 globs를 확인하라."
            exit 1
          fi
